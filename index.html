<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cuento Interactivo: La liebre y la tortuga</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #eef;
      padding: 20px;
      margin: 0;
    }
    .contenedor {
      max-width: 700px;
      margin: auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    /* Estilos para la sección de historia */
    #storySection img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    #storyContent {
      font-size: 1.3em;
      margin-bottom: 15px;
    }
    #storyButton {
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 15px;
    }
    /* Estilos para el quiz */
    .pregunta {
      font-size: 1.3em;
      margin-bottom: 15px;
    }
    .opciones button {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 1em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .correct { background-color: lightgreen; }
    .incorrect { background-color: lightcoral; }
    /* Estilos para la línea de carrera */
    #raceTrack {
      margin-top: 40px;
      position: relative;
      height: 100px;
      /* Puedes ajustar el ancho si lo deseas */
      width: 600px;
      border: 2px dashed transparent;
    }
    #raceTrack .track-line {
      height: 4px;
      background: gray;
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
    }
    /* Línea de meta (roja) */
    #finishLine {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: red;
    }
    /* Posición de los personajes */
    #tortuga, #liebre {
      position: absolute;
      width: 60px;
    }
    #tortuga { top: 0; left: 0; }
    #liebre { top: 50px; left: 0; }
    /* Botón de reiniciar */
    #resetButton {
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <!-- Sección de historia -->
    <div id="storySection">
      <img id="storyImage" src="" alt="Historia" />
      <div id="storyContent"></div>
      <button id="storyButton">Continuar</button>
    </div>
    
    <!-- Sección de preguntas y carrera -->
    <div id="quizSection" style="display:none;">
      <div id="questionContainer"></div>
      <div id="optionsContainer" class="opciones"></div>
      <div id="raceTrack">
        <div class="track-line"></div>
        <div id="finishLine"></div>
        <img id="tortuga" src="6.png" alt="Tortuga" />
        <img id="liebre" src="7.png" alt="Liebre" />
      </div>
    </div>
  </div>

  <!-- Audios para acierto, error y éxito -->
  <audio id="audioCorrect" src="acierto.wav"></audio>
  <audio id="audioError" src="error.wav"></audio>
  <audio id="audioSuccess" src="exito.wav"></audio>

  <script>
    /*********************** SECCIÓN DE HISTORIA ************************/
    const storyParts = [
      { texto: "Había una vez una liebre muy rápida y una tortuga muy perseverante.", imagen: "1.png" },
      { texto: "Un día, decidieron hacer una carrera por la ciudad moderna.", imagen: "2.png" },
      { texto: "La liebre confiaba en su velocidad y se detuvo a descansar.", imagen: "3.png" },
      { texto: "La tortuga, aunque despacio, siguió avanzando sin detenerse.", imagen: "4.png" },
      { texto: "Al final, la tortuga ganó la carrera. ¡Bravo por ella!", imagen: "5.png" }
    ];

    let currentStoryIndex = 0;
    const storyContentDiv = document.getElementById("storyContent");
    const storyImage = document.getElementById("storyImage");
    const storyButton = document.getElementById("storyButton");

    function showStoryPart() {
      storyContentDiv.innerHTML = "<p>" + storyParts[currentStoryIndex].texto + "</p>";
      // Para evitar caché, se añade un parámetro
      storyImage.src = storyParts[currentStoryIndex].imagen + "?v=" + new Date().getTime();
      storyButton.textContent = (currentStoryIndex === storyParts.length - 1) ? "Iniciar Preguntas" : "Continuar";
    }

    storyButton.addEventListener("click", function() {
      currentStoryIndex++;
      if (currentStoryIndex < storyParts.length) {
        showStoryPart();
      } else {
        document.getElementById("storySection").style.display = "none";
        document.getElementById("quizSection").style.display = "block";
        showQuestion(currentQuestion);
      }
    });
    showStoryPart();

    /*********************** SECCIÓN DE PREGUNTAS Y CARRERA ************************/
    const questions = [
      {
        pregunta: "1. ¿Quién corría con la tortuga?",
        opciones: [
          { texto: "La liebre", correcta: true },
          { texto: "El ratón", correcta: false },
          { texto: "El gato", correcta: false },
          { texto: "El perro", correcta: false }
        ]
      },
      {
        pregunta: "2. ¿Qué animal era más rápido?",
        opciones: [
          
          { texto: "La tortuga", correcta: false },
          { texto: "El pez", correcta: false },
          { texto: "La liebre", correcta: true },
          { texto: "El pájaro", correcta: false }
        ]
      },
      {
        pregunta: "3. ¿Qué hizo la liebre en la carrera?",
        opciones: [
          
          { texto: "Corrió más", correcta: false },
          { texto: "Se durmió", correcta: true },
          { texto: "Saltó", correcta: false },
          { texto: "Voló", correcta: false }
        ]
      },
      {
        pregunta: "4. ¿Qué hizo la tortuga?",
        opciones: [
          
          { texto: "Se durmió", correcta: false },
          { texto: "Se escondió", correcta: false },
          { texto: "Saltó", correcta: false },
          { texto: "Siguió sin parar", correcta: true }
        ]
      },
      {
        pregunta: "5. ¿Quién ganó la carrera?",
        opciones: [
          
          { texto: "La liebre", correcta: false },
          { texto: "El juez", correcta: false },
          { texto: "La tortuga", correcta: true },
          { texto: "Nadie", correcta: false }
        ]
      },
      {
        pregunta: "6. ¿Por qué ganó la tortuga?",
        opciones: [
          
          { texto: "Corrió muy rápido", correcta: false },
          { texto: "Fue constante", correcta: true },
          { texto: "Saltó mucho", correcta: false },
          { texto: "Durmió bien", correcta: false }
        ]
      },
      {
        pregunta: "7. ¿Qué aprendemos de esta historia?",
        opciones: [
          
          { texto: "Hay que dormir mucho", correcta: false },
          { texto: "Hay que ser rápido", correcta: false },
          { texto: "Hay que saltar alto", correcta: false },
          { texto: "Hay que seguir sin rendirse", correcta: true }
        ]
      },
      {
        pregunta: "8. ¿Cómo se sentía la liebre al final?",
        opciones: [
          
          { texto: "Feliz", correcta: false },
          { texto: "Tranquila", correcta: false },
          { texto: "Sorprendida", correcta: true },
          { texto: "Contenta", correcta: false }
        ]
      },
      {
        pregunta: "9. ¿Cómo se sentía la tortuga al ganar?",
        opciones: [
          { texto: "Feliz", correcta: true },
          { texto: "Triste", correcta: false },
          { texto: "Enfadada", correcta: false },
          { texto: "Dormida", correcta: false }
        ]
      },
      {
        pregunta: "10. ¿Qué valor muestra la tortuga?",
        opciones: [
          
          { texto: "Rapidez", correcta: false },
          { texto: "Constancia", correcta: true },
          { texto: "Pereza", correcta: false },
          { texto: "Tristeza", correcta: false }
        ]
      }
    ];

    // Variables para llevar la cuenta de movimientos (cada pregunta equivale a 1 movimiento)
    let currentQuestion = 0;
    const totalMoves = 10; // Se terminará el juego al alcanzar 10 movimientos en cualquiera de las dos
    let tortugaPos = 0;
    let liebrePos = 0;
    const trackWidth = 600; // Debe coincidir con el ancho de #raceTrack

    function showQuestion(index) {
      const questionContainer = document.getElementById("questionContainer");
      const optionsContainer = document.getElementById("optionsContainer");
      questionContainer.innerHTML = "";
      optionsContainer.innerHTML = "";

      // Si se han respondido todas las preguntas o alguien llegó a la meta, termina el juego
      if (index >= questions.length || tortugaPos >= totalMoves || liebrePos >= totalMoves) {
        finishGame();
        return;
      }

      const q = questions[index];
      questionContainer.innerHTML = "<p class='pregunta'>" + q.pregunta + "</p>";

      q.opciones.forEach(opcion => {
        const button = document.createElement("button");
        button.innerText = opcion.texto;
        button.addEventListener("click", () => checkAnswer(button, opcion.correcta));
        optionsContainer.appendChild(button);
      });
    }

    function checkAnswer(button, isCorrect) {
      const tortuga = document.getElementById("tortuga");
      const liebre = document.getElementById("liebre");

      if (isCorrect) {
        button.classList.add("correct");
        document.getElementById("audioCorrect").play();
        document.querySelectorAll("#optionsContainer button").forEach(b => b.disabled = true);
        tortugaPos++;
        let pos = (tortugaPos / totalMoves) * trackWidth;
        tortuga.style.left = pos + "px";
        setTimeout(() => {
          // Si la tortuga ya llegó a la meta, termina el juego
          if (tortugaPos >= totalMoves) {
            finishGame();
          } else {
            currentQuestion++;
            showQuestion(currentQuestion);
          }
        }, 1000);
      } else {
        button.classList.add("incorrect");
        button.disabled = true;
        document.getElementById("audioError").play();
        liebrePos++;
        let pos = (liebrePos / totalMoves) * trackWidth;
        liebre.style.left = pos + "px";
        // Si la liebre ya llegó a la meta, termina el juego inmediatamente
        if (liebrePos >= totalMoves) {
          finishGame();
        }
      }
    }

    function finishGame() {
      const questionContainer = document.getElementById("questionContainer");
      const optionsContainer = document.getElementById("optionsContainer");
      // Desactivar todos los botones
      document.querySelectorAll("#optionsContainer button").forEach(b => b.disabled = true);
      
      if (tortugaPos >= totalMoves) {
        document.getElementById("audioSuccess").play();
        questionContainer.innerHTML = "<h2>¡Enhorabuena!</h2><p>La tortuga ha ganado la carrera. Con constancia y perseverancia se logran grandes cosas.</p>";
      } else if (liebrePos >= totalMoves) {
        questionContainer.innerHTML = "<h2>¡Fin del juego!</h2><p>La liebre ha ganado la carrera. ¡Inténtalo de nuevo para demostrar tus valores!</p>";
        optionsContainer.innerHTML = "<button id='resetButton'>Reiniciar Quiz</button>";
        document.getElementById("resetButton").addEventListener("click", resetQuiz);
      } else {
        // Si se contestaron todas las preguntas sin que alguien llegara a 10, se compara quién avanzó más.
        if (tortugaPos >= liebrePos) {
          document.getElementById("audioSuccess").play();
          questionContainer.innerHTML = "<h2>¡Enhorabuena!</h2><p>La tortuga ha ganado la carrera. La perseverancia paga.</p>";
        } else {
          questionContainer.innerHTML = "<h2>¡Fin del juego!</h2><p>La liebre ha ganado la carrera. ¡Inténtalo de nuevo para demostrar tus valores!</p>";
          optionsContainer.innerHTML = "<button id='resetButton'>Reiniciar Quiz</button>";
          document.getElementById("resetButton").addEventListener("click", resetQuiz);
        }
      }
    }

    function resetQuiz() {
      currentQuestion = 0;
      tortugaPos = 0;
      liebrePos = 0;
      document.getElementById("tortuga").style.left = "0px";
      document.getElementById("liebre").style.left = "0px";
      showQuestion(currentQuestion);
    }
  </script>
</body>
</html>
